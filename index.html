function dateParts(){const d=new Date(data.today+'T12:00:00');return{d,weekday:['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()]}}
function renderHome(){const {d,weekday}=dateParts(),tm=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('home-date').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${weekday}`;document.getElementById('lock-date').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${weekday}`;document.getElementById('home-clock').textContent=tm;document.getElementById('lock-time').textContent=tm;document.getElementById('status-time').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});document.getElementById('weather-icon').textContent=data.weather.icon;document.getElementById('next-event').textContent=data.events[0]?`${data.events[0].date} ${data.events[0].time} · ${data.events[0].title} – ${data.events[0].place}`:'예정된 일정이 없어요';document.getElementById('lock-preview').textContent=data.messages[0]?`${data.messages[0].name}: ${data.messages[0].text}`:'새 알림이 없어요';document.getElementById('app-grid').innerHTML=appDefs.map(a=>appButton(a)).join('');document.getElementById('dock').innerHTML=dockDefs.map(a=>appButton(a)).join('')}
function appButton(a){let count=a[0]==='mail'?data.emails.length:a[0]==='messages'?data.messages.filter(m=>!m.read).length:a[0]==='phone'?data.calls.filter(c=>c.missed).length:a[0]==='kakao'?data.kakao.length:0;return `<button class="appbtn" data-open="${a[0]}"><span class="appicon" style="background:${a[3]}">${a[2]}${count?`<i class="badge">${count}</i>`:''}</span><span class="app-label">${a[1]}</span></button>`}
document.getElementById('app-grid').addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(b)openApp(b.dataset.open)});document.getElementById('dock').addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(b)openApp(b.dataset.open)});
let startY=null;document.getElementById('device').addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});document.getElementById('device').addEventListener('touchend',e=>{if(startY!==null&&startY-e.changedTouches[0].clientY>35)showPin();startY=null},{passive:true});document.getElementById('swipe-hint').addEventListener('click',showPin);document.getElementById('lock').addEventListener('click',e=>{if(e.target.closest('button'))return;showPin()});
function showPin(){document.getElementById('pin').classList.add('show');pin='';drawDots()}
function cancelPin(){document.getElementById('pin').classList.remove('show')}
function drawDots(){document.querySelectorAll('#dots i').forEach((x,i)=>x.classList.toggle('filled',i<pin.length))}
const keypad=document.getElementById('keypad');keypad.innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(n=>n?`<button data-key="${n}"><b>${n}</b>${n==='2'?'<small>ABC</small>':n==='3'?'<small>DEF</small>':n==='4'?'<small>GHI</small>':n==='5'?'<small>JKL</small>':n==='6'?'<small>MNO</small>':n==='7'?'<small>PQRS</small>':n==='8'?'<small>TUV</small>':n==='9'?'<small>WXYZ</small>':''}</button>`:'<span></span>').join('');keypad.addEventListener('click',e=>{let b=e.target.closest('[data-key]');if(!b)return;let k=b.dataset.key;if(k==='⌫'){pin=pin.slice(0,-1);drawDots();return}pin+=k;drawDots();if(pin.length===4)setTimeout(unlockPhone,180)});
function unlockPhone(){if(data.passcode&&pin!==data.passcode){pin='';drawDots();toast('암호가 맞지 않아요');return}document.getElementById('pin').classList.remove('show');document.getElementById('lock').classList.add('lock-away');document.getElementById('home').classList.add('show');if(!sessionStorage.getItem('p3-incoming')){sessionStorage.setItem('p3-incoming','1');incomingTimer=setTimeout(()=>showIncoming(data.incoming.from),Math.max(1,(Number(data.incoming.afterMinutes)||3)*60000))}}
function goHome(){if(document.getElementById('call-screen').classList.contains('show'))return;document.getElementById('app-screen').classList.remove('open');currentApp=''}function goBack(){if(activeChat){activeChat='';renderApp(currentApp);return}if(activeMail!==null){activeMail=null;renderApp('mail');return}goHome()}
function openApp(id){currentApp=id;activeChat='';activeMail=null;document.getElementById('app-title').textContent=appNames[id];document.getElementById('app-screen').classList.add('open');renderApp(id)}
function renderApp(id){let body=document.getElementById('app-body'),html='';body.classList.toggle('chat-body',(id==='messages'||id==='kakao')&&!!activeChat);if(id==='mail')html=renderMail();else if(id==='calendar')html=renderCalendar();else if(id==='clock')html=renderClock();else if(id==='weather')html=renderWeather();else if(id==='notes')html=renderNotes();else if(id==='photos')html=renderPhotos();else if(id==='camera')html=renderCamera();else if(id==='phone')html=renderCalls();else if(id==='chrome')html=renderChrome();else if(id==='messages')html=renderMessages();else if(id==='kakao')html=renderKakao();body.innerHTML=html;bindApp(id)}
function renderMail(){if(activeMail!==null){let m=data.emails[activeMail];if(!m)return '<p class=\"muted\">메일을 찾을 수 없어요.</p>';return `<button class=\"action soft\" onclick=\"activeMail=null;renderApp('mail')\">‹ 받은편지함</button><div class=\"card\" style=\"margin-top:13px\"><div class=\"row\"><span class=\"avatar\">${esc((m.from||'편지')[0])}</span><span class=\"row-main\"><b>${esc(m.from)}</b><small class=\"muted\">${esc(m.time||'')}</small></span></div><h3 style=\"font-size:17px;margin:16px 0 5px\">${esc(m.subject)}</h3></div><div class=\"card\" style=\"min-height:180px;white-space:pre-wrap;line-height:1.75\">${esc(m.text)}</div>`}return `<div class=\"row\" style=\"margin:2px 0 14px\"><b>받은편지함</b><button class=\"action soft\" onclick=\"openEditor('emails')\">편집</button></div>${data.emails.map((m,i)=>`<button class=\"app-row\" data-mail=\"${i}\"><span class=\"avatar\">${esc((m.from||'편지')[0])}</span><span class=\"row-main\"><b>${esc(m.from)} <small class=\"muted\">${esc(m.time)}</small></b><span class=\"preview\"><strong>${esc(m.subject)}</strong> · ${esc(m.text)}</span></span></button>`).join('')||'<p class=\"muted\">메일이 없어요.</p>'}`}
function renderCalendar(){let d=new Date(data.today+'T12:00:00'),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells=Array(first).fill('<span></span>').concat(Array.from({length:days},(_,i)=>`<span class="month-cell ${i+1===d.getDate()?'today':''}">${i+1}</span>`));return `<div class="month-nav"><button onclick="toast('이 데모는 설정한 날짜의 달력을 보여줘요')">‹</button><b>${y}년 ${m+1}월</b><button onclick="toast('이 데모는 설정한 날짜의 달력을 보여줘요')">›</button></div><div class="month-grid">${['일','월','화','수','목','금','토'].map(x=>`<b class="month-cell">${x}</b>`).join('')}${cells.join('')}</div><h3 style="font-size:15px;margin:20px 0 10px">일정</h3>${data.events.map(e=>`<div class="card"><span class="pill">${esc(e.date)} · ${esc(e.time)}</span><p class="event-line"><b>${esc(e.title)}</b><br>${esc(e.place)}</p></div>`).join('')}<button class="action" onclick="openEditor('events')">＋ 일정 추가</button>`}
function renderClock(){return `<div class="card" style="text-align:center"><div class="muted">현재 시간</div><div style="font-size:48px;font-weight:300;margin:8px">${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</div><span class="pill">세계 시계 · 서울</span></div><h3 style="font-size:15px">알람</h3>${data.alarms.map(a=>`<div class="card row"><strong style="font-size:26px">${esc(a.time)}</strong><span class="muted">${esc(a.label)}</span><span>◉</span></div>`).join('')}<button class="action" onclick="openEditor('alarms')">＋ 알람 추가</button>`}
function renderWeather(){return `<div class="card" style="text-align:center;background:linear-gradient(145deg,#dcefff,#f8fbff);padding:25px"><div class="muted">${esc(data.weather.city)} · 지금</div><div style="font-size:70px;margin:12px">${esc(data.weather.icon)}</div><div style="font-size:49px;font-weight:300">${esc(data.weather.temp)}</div><div class="muted">날씨 정보는 편집 화면에서 바꿀 수 있어요.</div></div><button class="action soft" onclick="openEditor('weather')">날씨 편집</button>`}
function renderNotes(){return `<div class="row" style="margin-bottom:12px"><b>모든 메모</b><button class="action" onclick="openEditor('notes')">＋ 새 메모</button></div>${data.notes.map((n,i)=>`<button class="app-row" data-note="${i}"><span class="avatar" style="border-radius:12px;background:#fff1b9">📝</span><span class="row-main"><b>${esc(n.title)}</b><span class="preview">${esc(n.text)}</span><small class="muted">${esc(n.time)}</small></span></button>`).join('')||'<p class="muted">저장된 메모가 없어요.</p>'}`}
function renderPhotos(){return `<div class="row" style="margin-bottom:12px"><b>최근 항목</b><button class="action soft" onclick="openEditor('photos')">편집</button></div><div class="photo-grid">${data.photos.map(p=>`<div class="card" style="padding:7px"><div class="photo-tile">${p.image?`<img src="${p.image}" alt="${esc(p.title)}">`:esc(p.emoji||'🖼️')}</div><b>${esc(p.title)}</b><div class="muted">${esc(p.caption)}</div></div>`).join('')}</div>`}
function renderCamera(){return `<div style="height:55vh;max-height:430px;border-radius:21px;background:radial-gradient(circle at 55% 35%,#3c5068,#131a24 70%);display:grid;place-items:center;color:#e1e8f0">카메라 미리보기</div><div class="row" style="justify-content:center;padding:17px"><button class="action" style="width:66px;height:66px;border-radius:50%;font-size:25px" onclick="takePhoto()">●</button></div><p class="muted">화면을 눌러 가상 사진을 앨범에 추가할 수 있어요.</p>`}
function renderCalls(){return `<div class="row" style="margin-bottom:10px"><b>최근 통화</b><button class="action soft" onclick="openEditor('calls')">편집</button></div>${data.calls.map((c,i)=>`<button class="app-row" data-call="${i}"><span class="avatar" style="background:#e8f5eb;color:#278246">☎</span><span class="row-main"><b style="color:${c.missed?'#d43e49':'inherit'}">${esc(c.name)}</b><span class="preview">${esc(c.type)} · 휴대전화</span></span><span class="muted">${esc(c.time)}</span><span style="color:#3a9e66">☎</span></button>`).join('')}<h3 style="font-size:14px;margin-top:20px">연락처</h3>${data.contacts.map(c=>`<button class="app-row" data-dial="${esc(c.name)}"><span class="avatar">${esc(c.name[0])}</span><span class="row-main"><b>${esc(c.name)}</b><span class="preview">${esc(c.number)}</span></span><span style="color:#3a9e66">☎</span></button>`).join('')}`}
function renderChrome(){return `<div class="card" style="text-align:center;padding:25px"><div style="font-size:42px">🌐</div><h3>Chrome</h3><div class="field"><input id="chrome-url" placeholder="웹 주소 입력"></div><button class="action" onclick="openChromeURL()">열기</button></div><div class="card"><b>자주 방문한 페이지</b><div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-top:12px">${data.chrome.shortcuts.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div><p class="muted">검색 전용 앱은 없어요. Chrome은 주소를 입력하는 시뮬레이터 화면입니다.</p>`}
function renderMessages(){if(activeChat)return renderThread('messages',activeChat);let names=[...new Set(data.messages.map(m=>m.name))];return `<div class="row" style="margin-bottom:12px"><b>메시지</b><button class="action soft" onclick="openEditor('messages')">편집</button></div>${names.map(name=>{let m=data.messages.filter(x=>x.name===name).slice(-1)[0],re=(data.replies[name]||[]).slice(-1)[0];return `<button class="app-row" data-thread="${esc(name)}"><span class="avatar">${esc(name[0])}</span><span class="row-main"><b>${esc(name)}</b><span class="preview">${esc(re?re.text:m.text)}</span></span><small class="muted">${esc(re?.time||m.time)}</small></button>`}).join('')}`}
function renderKakao(){if(activeChat)return renderThread('kakao',activeChat);let names=[...new Set(data.kakao.map(m=>m.name))];return `<div class="row" style="margin-bottom:12px"><b>채팅</b><button class="action soft" onclick="openEditor('kakao')">편집</button></div>${names.map(name=>{let m=data.kakao.filter(x=>x.name===name).slice(-1)[0];return `<button class="app-row" data-kakao-thread="${esc(name)}"><span class="avatar" style="background:#ffe783;color:#62500a">●</span><span class="row-main"><b>${esc(name)}</b><span class="preview">${esc(m.text)}</span></span><small class="muted">${esc(m.time)}</small></button>`}).join('')}`}
function renderThread(kind,name){let arr=kind==='messages'?data.messages.filter(m=>m.name===name):data.kakao.filter(m=>m.name===name);let replies=(data.replies[`${kind}:${name}`]||[]);return `<div class=\"chat-feed\"><div class=\"row\"><button class=\"action soft\" onclick=\"activeChat='';renderApp(currentApp)\">‹ 대화 목록</button><b>${esc(name)}</b></div><div style=\"padding:8px 0 18px\">${arr.map(m=>`<div class=\"${m.me?'bubble me':'bubble'}\">${esc(m.text)}<small class=\"bubble-time\">${esc(m.time||'')}</small></div>`).join('')}${replies.map(m=>`<div class=\"bubble me\">${esc(m.text)}<small class=\"bubble-time\">${esc(m.time)}</small></div>`).join('')}</div></div><form class=\"composer\" onsubmit=\"sendChat(event,'${kind}','${esc(name)}')\"><input id=\"chat-input\" placeholder=\"${kind==='messages'?'문자 메시지':'메시지'} 입력\"><button class=\"action\">전송</button></form>`}
function bindApp(id){let b=document.getElementById('app-body');b.querySelectorAll('[data-thread]').forEach(x=>x.onclick=()=>{activeChat=x.dataset.thread;renderApp(id)});b.querySelectorAll('[data-kakao-thread]').forEach(x=>x.onclick=()=>{activeChat=x.dataset.kakaoThread;renderApp(id)});b.querySelectorAll('[data-call]').forEach(x=>x.onclick=()=>placeCall(data.calls[+x.dataset.call].name));b.querySelectorAll('[data-dial]').forEach(x=>x.onclick=()=>placeCall(x.dataset.dial));b.querySelectorAll('[data-note]').forEach(x=>x.onclick=()=>{let n=data.notes[+x.dataset.note];alert(n.title+'\n\n'+n.text)});b.querySelectorAll('[data-mail]').forEach(x=>x.onclick=()=>{activeMail=+x.dataset.mail;renderApp('mail')});}
function sendChat(e,kind,name){e.preventDefault();let v=document.getElementById('chat-input').value.trim();if(!v)return;let key=`${kind}:${name}`;data.replies[key]??=[];data.replies[key].push({text:v,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})});saveData();renderApp(currentApp)}
function takePhoto(){data.photos.unshift({title:'새 사진',caption:'방금 촬영',emoji:'📸'});saveData();toast('사진을 갤러리에 저장했어요')}
function openChromeURL(){let q=document.getElementById('chrome-url').value.trim();if(!q){toast('주소를 입력해 주세요');return}toast('Chrome 화면에서 주소를 여는 시뮬레이션이에요')}
function placeCall(name){const c=data.contacts.find(x=>x.name===name);startCall(name,'발신',data.callScripts?.[name]||c?.lines||['여보세요?','지금 통화 괜찮아요?','네, 알겠어요. 나중에 다시 연락할게요.'])}
function showIncoming(name){document.getElementById('incoming-name').textContent=name;document.getElementById('incoming-banner').classList.add('show');document.getElementById('call-screen').dataset.name=name;document.getElementById('call-screen').dataset.direction='수신';navigator.vibrate?.([250,180,250,180,250])}
function declineIncoming(){let name=document.getElementById('incoming-name').textContent;document.getElementById('incoming-banner').classList.remove('show');data.calls.unshift({name,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),type:'부재중',missed:true});saveData()}
function answerIncoming(){let name=document.getElementById('incoming-name').textContent;document.getElementById('incoming-banner').classList.remove('show');let c=data.contacts.find(x=>x.name===name);startCall(name,'수신',data.callScripts?.[name]||c?.lines||data.incoming.lines)}
function startCall(name,type,lines){clearInterval(callTimer);clearTimeout(callLineTimer);document.getElementById('call-name').textContent=name;document.getElementById('call-avatar').textContent=name[0];document.getElementById('call-state').textContent=type==='발신'?'연결 중…':'수신 전화';document.getElementById('call-line').textContent='';document.getElementById('call-line').classList.remove('show');document.getElementById('call-answer').style.display='flex';document.getElementById('call-controls').style.display='none';let s=document.getElementById('call-screen');s.dataset.name=name;s.dataset.direction=type;s.dataset.lines=JSON.stringify(lines);s.classList.add('show');if(type==='발신')setTimeout(answerCall,1100)}
function answerCall(){let s=document.getElementById('call-screen'),name=s.dataset.name,lines=JSON.parse(s.dataset.lines||'[]');document.getElementById('call-answer').style.display='none';document.getElementById('call-controls').style.display='grid';let state=document.getElementById('call-state');state.textContent='00:00';let t=Date.now();callTimer=setInterval(()=>{let v=Math.floor((Date.now()-t)/1000);state.textContent=`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`},1000);let i=0;const next=()=>{if(i>=lines.length){callLineTimer=setTimeout(endCall,900);return}let el=document.getElementById('call-line');el.classList.remove('show');setTimeout(()=>{el.textContent=lines[i++];el.classList.add('show');callLineTimer=setTimeout(next,2600)},250)};next()}
function endCall(){clearInterval(callTimer);clearTimeout(callLineTimer);let s=document.getElementById('call-screen');if(!s.classList.contains('show'))return;let name=s.dataset.name;document.getElementById('call-state').textContent='통화 종료';document.getElementById('call-line').classList.remove('show');data.calls.unshift({name,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),type:s.dataset.direction==='수신'?'수신':'발신',missed:false});saveData();setTimeout(()=>s.classList.remove('show'),850)}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const editorTabs={messages:'문자',kakao:'카카오톡',calls:'통화 대사',notes:'메모',emails:'메일',events:'일정',photos:'사진',contacts:'연락처',weather:'날씨'};let editorTab='messages';
function openEditor(tab){document.getElementById('editor').classList.add('show');editorTab=tab||'messages';renderEditor()}
function closeEditor(){document.getElementById('editor').classList.remove('show')}
function renderEditor(){document.getElementById('editor-tabs').innerHTML=Object.entries(editorTabs).map(([k,v])=>`<button class="tab ${k===editorTab?'on':''}" onclick="editorTab='${k}';renderEditor()">${v}</button>`).join('');let out=document.getElementById('editor-content');if(editorTab==='weather'){out.innerHTML=`<div class="field"><label>도시</label><input id="ed-city" value="${esc(data.weather.city)}"></div><div class="field"><label>기온</label><input id="ed-temp" value="${esc(data.weather.temp)}"></div><div class="field"><label>이모지</label><input id="ed-icon" value="${esc(data.weather.icon)}"></div><button class="action" onclick="data.weather={city:document.getElementById('ed-city').value,temp:document.getElementById('ed-temp').value,icon:document.getElementById('ed-icon').value};saveData();renderEditor()">저장</button>`;return}if(editorTab==='calls'){let names=[...new Set([...data.contacts.map(c=>c.name),...Object.keys(data.callScripts||{})])];out.innerHTML=`<div class=\"card\"><div class=\"field\"><label>통화 상대</label><select id=\"ed-call-name\" onchange=\"loadCallScript()\" style=\"width:100%;padding:10px;border:1px solid #d7dde7;border-radius:10px\">${names.map(n=>`<option value=\"${esc(n)}\">${esc(n)}</option>`).join('')}</select></div><div class=\"field\"><label>통화 중 재생할 대사 (한 줄에 하나씩)</label><textarea id=\"ed-call-lines\" style=\"min-height:145px\"></textarea></div><button class=\"action\" onclick=\"saveCallScript()\">통화 내용 저장</button></div><b>저장된 통화 대사</b>${Object.entries(data.callScripts||{}).map(([n,lines])=>`<div class=\"edit-item\"><b>${esc(n)}</b><div class=\"muted\" style=\"white-space:pre-wrap\">${esc(lines.join('\n'))}</div></div>`).join('')}`;loadCallScript();return}let fields={messages:['name','대화 상대','text','메시지 내용'],kakao:['name','대화 상대','text','메시지 내용'],notes:['title','메모 제목','text','내용'],emails:['from','보낸 사람','subject','메일 제목'],events:['title','일정 이름','date','날짜 YYYY-MM-DD'],photos:['title','사진 이름','caption','설명'],contacts:['name','연락처 이름','number','전화번호'],calls:['name','통화 상대','time','시간']}[editorTab];if(editorTab==='emails'||editorTab==='events'||editorTab==='photos'||editorTab==='notes'||editorTab==='contacts'||editorTab==='messages'||editorTab==='kakao'||editorTab==='calls'){let arr=editorTab==='messages'?data.messages:editorTab==='kakao'?data.kakao:editorTab==='calls'?data.calls:data[editorTab];out.innerHTML=`<div class="card"><div class="field"><label>${fields[1]}</label><input id="ed-a"></div><div class="field"><label>${fields[3]}</label><textarea id="ed-b"></textarea></div>${editorTab==='emails'?'<div class="field"><label>메일 내용</label><textarea id="ed-extra"></textarea></div>':''}${editorTab==='events'?'<div class="field"><label>시간과 장소</label><input id="ed-extra" placeholder="10:00 · 장소"></div>':''}${editorTab==='calls'?'<div class="field"><label>통화 대사 (한 줄에 한 대사)</label><textarea id="ed-extra" placeholder="안녕하세요.&#10;네, 잘 지내요."></textarea></div>':''}<button class="action" onclick="addEditedItem()">＋ 추가</button></div><b>${editorTabs[editorTab]} 목록</b>${arr.map((x,i)=>`<div class="edit-item"><div class="row"><span><b>${esc(x.name||x.title||x.from||'')}</b><br><span class="muted">${esc(x.text||x.subject||x.number||x.time||'')}</span></span><button onclick="deleteEditedItem(${i})">삭제</button></div></div>`).join('')||'<p class="muted">등록된 내용이 없어요.</p>'}`}}
function loadCallScript(){let n=document.getElementById('ed-call-name')?.value;if(!n)return;let c=data.contacts.find(x=>x.name===n);document.getElementById('ed-call-lines').value=(data.callScripts?.[n]||c?.lines||[]).join('\n')}function saveCallScript(){let n=document.getElementById('ed-call-name')?.value,lines=(document.getElementById('ed-call-lines')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!n){toast('상대방을 선택해 주세요');return}data.callScripts??={};data.callScripts[n]=lines;saveData();renderEditor();toast('통화 내용을 저장했어요')}
function addEditedItem(){let a=document.getElementById('ed-a')?.value.trim(),b=document.getElementById('ed-b')?.value.trim(),ex=document.getElementById('ed-extra')?.value.trim();if(!a){toast('이름이나 제목을 입력해 주세요');return}if(editorTab==='messages'||editorTab==='kakao'){data[editorTab].push({name:a,time:'방금',text:b||'새 메시지'});if(editorTab==='messages')data.replies[`${editorTab}:${a}`]??=[]}else if(editorTab==='notes')data.notes.unshift({title:a,text:b,time:'오늘'});else if(editorTab==='emails')data.emails.unshift({from:a,subject:b,text:ex||'',time:'방금'});else if(editorTab==='events'){let [time,...place]=ex.split('·');data.events.push({title:a,date:b||data.today,time:time.trim()||'종일',place:place.join('·').trim()})}else if(editorTab==='photos')data.photos.unshift({title:a,caption:b||'',emoji:'🖼️'});else if(editorTab==='contacts')data.contacts.push({name:a,number:b||'',lines:ex?ex.split('\n'):[]});saveData();renderEditor()}
function deleteEditedItem(i){let arr=editorTab==='messages'?data.messages:editorTab==='kakao'?data.kakao:editorTab==='calls'?data.calls:data[editorTab];arr.splice(i,1);saveData();renderEditor()}
function exportBackup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='peter3-phone-backup.json';a.click();URL.revokeObjectURL(u)}
function importBackup(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...structuredClone(seed),...JSON.parse(r.result)};saveData();renderEditor();toast('백업을 불러왔어요')}catch{toast('백업 파일을 확인해 주세요')}};r.readAsText(f)}
function resetData(){if(confirm('편집한 내용을 초기 상태로 되돌릴까요?')){data=structuredClone(seed);saveData();renderEditor()}}
renderHome();setInterval(renderHome,30000);openPhone();
</script>
</body>
</html>
